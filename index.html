<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RFQ 智能报价平台 · 可点击演示</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* 布局：工程图纸感的内网业务系统。顶部条 + 体验路线条；左侧导航，右侧工作区；报价单详情用“原文 | 清单”左右分栏，窄屏上下堆叠 */
:root{
  --bg:#edf0f3; --surface:#ffffff; --surface-2:#f5f7f9; --line:#d4dbe2; --line-strong:#b5c0cb;
  --fg:#16202a; --muted:#5b6876; --accent:#1c4f8f; --accent-fg:#ffffff; --accent-soft:#e1eaf6;
  --ai:#0b7275; --ai-soft:#dff1f0;
  --red:#b3352a; --red-soft:#fbe7e4; --amber:#9c640f; --amber-soft:#fcf0d9; --green:#28734a; --green-soft:#e2f1e7;
  --hl:#ffeb8a; --shadow:0 6px 24px rgba(20,32,45,.14);
  --font:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151b; --surface:#171e27; --surface-2:#1d2631; --line:#2a3644; --line-strong:#3c4b5c;
    --fg:#e3e9ef; --muted:#93a1b0; --accent:#78a9ea; --accent-fg:#0d1622; --accent-soft:#1b2c42;
    --ai:#5cc7c3; --ai-soft:#15302f;
    --red:#ef8073; --red-soft:#3a1f1c; --amber:#e3b25b; --amber-soft:#382c16; --green:#6dc493; --green-soft:#183224;
    --hl:#5b4a10; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151b; --surface:#171e27; --surface-2:#1d2631; --line:#2a3644; --line-strong:#3c4b5c;
  --fg:#e3e9ef; --muted:#93a1b0; --accent:#78a9ea; --accent-fg:#0d1622; --accent-soft:#1b2c42;
  --ai:#5cc7c3; --ai-soft:#15302f;
  --red:#ef8073; --red-soft:#3a1f1c; --amber:#e3b25b; --amber-soft:#382c16; --green:#6dc493; --green-soft:#183224;
  --hl:#5b4a10; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.shell{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;max-width:1440px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-size:20px;font-weight:700;letter-spacing:.01em}
h2{font-size:16px;font-weight:700}
h3{font-size:14px;font-weight:700}
p{margin:0}

/* 顶部 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px))}
.top-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-size:17px;letter-spacing:.04em}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line-strong);color:var(--muted);white-space:nowrap}
.top .spacer{flex:1}
.notice{font-size:12px;color:var(--muted)}

/* 体验路线条 */
.tour{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tour-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px}
.tour-bar{flex:1;min-width:120px;height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.tour-bar i{display:block;height:100%;background:var(--accent)}
.tour-steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;padding:0 14px 12px}
.tstep{display:flex;gap:8px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:7px 9px}
.tstep .n{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-family:var(--mono);border:1px solid var(--line-strong);color:var(--muted)}
.tstep.done .n{background:var(--green);border-color:var(--green);color:var(--surface)}
.tstep.next{border-color:var(--accent);background:var(--accent-soft)}
.tstep.next .n{border-color:var(--accent);color:var(--accent)}

/* 主体布局 */
.app{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:11px;color:var(--muted);letter-spacing:.08em;margin:12px 8px 4px}
.nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:0;background:none;padding:8px 10px;border-radius:var(--r)}
.nav button:hover{background:var(--surface)}
.nav button.on{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent);font-weight:500}
.badge{font-family:var(--mono);font-size:11px;min-width:18px;padding:0 6px;border-radius:999px;background:var(--red);color:var(--surface);text-align:center}
.main{min-width:0;display:flex;flex-direction:column;gap:16px}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .nav{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav .grp{display:none}
  .nav button{white-space:nowrap;background:var(--surface)}
  .nav button.on{box-shadow:inset 0 -3px 0 var(--accent)}
}

/* 通用组件 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-b{padding:14px 16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:6px 12px;line-height:1.3;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:500}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.warn{border-color:var(--amber);color:var(--amber)}
.btn:disabled{opacity:.45;cursor:not-allowed;border-color:var(--line)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip.red{background:var(--red-soft);border-color:transparent;color:var(--red)}
.chip.amber{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.chip.green{background:var(--green-soft);border-color:transparent;color:var(--green)}
.chip.blue{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.ai{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:0 6px;border-radius:3px;background:var(--ai-soft);color:var(--ai);font-weight:500;white-space:nowrap}
.ai::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ai)}
.note{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line-strong);border-radius:var(--r);padding:8px 10px}
.scroll-x{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{font-weight:500;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--surface-2)}
.t td.num,.t th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
input.in,select.in,textarea.in{border:1px solid var(--line-strong);background:var(--surface);border-radius:4px;padding:4px 7px;min-width:0}
input.in.num{width:84px;text-align:right;font-family:var(--mono)}
input.in.err{border-color:var(--red);background:var(--red-soft)}
input.in.warn{border-color:var(--amber);background:var(--amber-soft)}
textarea.in{width:100%;min-height:72px;resize:vertical}
.flash{animation:flash 1.6s ease-out 2}
@keyframes flash{0%{background:var(--hl)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none;background:var(--hl)}}

/* 详情页 */
.qhead{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline}
.steps{display:flex;gap:0;overflow-x:auto;padding:12px 16px}
.st{flex:1;min-width:76px;text-align:center;font-size:12px;color:var(--muted);position:relative;padding-top:18px}
.st::before{content:"";position:absolute;top:6px;left:0;right:0;height:2px;background:var(--line)}
.st::after{content:"";position:absolute;top:2px;left:calc(50% - 5px);width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--line-strong)}
.st.done::before,.st.cur::before{background:var(--accent)}
.st.done::after{background:var(--accent);border-color:var(--accent)}
.st.cur{color:var(--fg);font-weight:500}
.st.cur::after{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);padding:0 8px}
.tabs button{border:0;background:none;padding:10px 12px;white-space:nowrap;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:500}
.tabs button .badge{margin-left:4px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:0}
.split>div{min-width:0}
.pane{max-height:640px;overflow:auto;position:relative}
.pane+.pane{border-left:1px solid var(--line)}
@media (max-width:1000px){.split{grid-template-columns:minmax(0,1fr)}.pane+.pane{border-left:0;border-top:1px solid var(--line)}.pane{max-height:420px}}
.page{padding:14px 18px;border-bottom:1px dashed var(--line);font-family:Georgia,"Times New Roman","Noto Serif SC",serif;font-size:14px;line-height:1.7}
.page .ph{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:4px;letter-spacing:.04em}
.page .zh{font-family:var(--font);font-size:13px;color:var(--muted);margin-top:6px;border-left:2px solid var(--line-strong);padding-left:8px}
.seg{border-radius:2px;transition:background .2s}
.seg.mark{border-bottom:1px dotted var(--line-strong)}
.seg.hl{background:var(--hl)}
.grp-h{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}
.req{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.req:hover{background:var(--surface-2)}
.req.on{background:var(--accent-soft)}
.req .id{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:1px}
.req .orig{grid-column:2/4;font-size:12px;color:var(--muted);font-family:Georgia,"Times New Roman",serif}
.req .acts{display:flex;gap:4px;align-items:flex-start}
.req.deleted{opacity:.45}
.req.deleted .sum{text-decoration:line-through}
.cbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface-2)}
.ck{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:9px 14px;border-bottom:1px solid var(--line);align-items:center}
.ck .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ck.miss{background:var(--red-soft)}
.ck.miss.done{background:transparent}
.cl{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.cl .ask{font-family:Georgia,"Times New Roman",serif;font-size:13px;color:var(--muted);border-left:2px solid var(--line-strong);padding-left:8px}
.cl.deleted{opacity:.45}
.draw svg{width:100%;height:auto;display:block;background:var(--surface-2)}
.draw .ln{stroke:var(--fg);stroke-width:1.4;fill:none}
.draw .thin{stroke:var(--muted);stroke-width:.8;fill:none}
.draw .txt{fill:var(--fg);font-family:var(--mono);font-size:11px}
.draw .txt.s{font-size:9px;fill:var(--muted)}
.draw .box{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.fld{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.fld:hover,.fld.on{background:var(--accent-soft)}
.fld.low{background:var(--amber-soft)}
.fld.low.on{background:var(--accent-soft)}

/* 成本核算 */
.cost-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:1100px){.cost-grid{grid-template-columns:minmax(0,1fr)}}
.price{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.01em}
.bd{display:grid;grid-template-columns:auto 1fr auto;gap:5px 10px;align-items:center;font-size:13px}
.bd .bar{height:8px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.bd .bar i{display:block;height:100%;background:var(--accent)}
.rule{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.rule:last-child{border-bottom:0}
.rule .code{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none;width:38px;padding-top:2px}
.sim{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.sim.on{background:var(--accent-soft)}
.mini{display:flex;height:7px;border-radius:2px;overflow:hidden;background:var(--surface-2)}
.mini i:nth-child(1){background:var(--accent)} .mini i:nth-child(2){background:var(--ai)} .mini i:nth-child(3){background:var(--amber)} .mini i:nth-child(4){background:var(--muted)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--c)}
.jnode{border:1px solid var(--amber);background:var(--amber-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.jnode.ok{border-color:var(--line);background:var(--surface-2)}

/* 看板 */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.2}
.kpi.red b{color:var(--red)} .kpi.amber b{color:var(--amber)}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);gap:10px;overflow-x:auto;padding:14px 16px}
.col{display:flex;flex-direction:column;gap:6px}
.col-h{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;border-bottom:2px solid var(--line);padding-bottom:4px}
.qc{border:1px solid var(--line);border-radius:4px;padding:7px 8px;background:var(--surface-2);font-size:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.qc:hover{border-color:var(--accent)}
.qc.r{border-left:3px solid var(--red)} .qc.y{border-left:3px solid var(--amber)}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:900px){.charts{grid-template-columns:minmax(0,1fr)}}
svg.ch{width:100%;height:auto;display:block}
svg.ch.bars{max-width:640px}
svg.ch .ax{stroke:var(--line);stroke-width:1}
svg.ch .lab{fill:var(--muted);font-size:11px;font-family:var(--mono)}
svg.ch .labt{fill:var(--fg);font-size:12px;font-family:var(--font)}
svg.ch .line{stroke:var(--accent);stroke-width:2.2;fill:none}
svg.ch .area{fill:var(--accent);fill-opacity:.08;stroke:none}
svg.ch .dot{fill:var(--accent)}
svg.ch .tgt{stroke:var(--green);stroke-width:1.4;stroke-dasharray:5 4}
svg.ch .base{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3}
svg.ch .bar{fill:var(--accent)}
svg.ch .bar.warn{fill:var(--amber)}
svg.ch .hit{fill:transparent;cursor:pointer}
.eff td.ok{color:var(--green)} .eff td.near{color:var(--amber)}

/* 弹窗和提示 */
.modal-bg{position:fixed;inset:0;background:rgba(10,16,24,.45);z-index:40;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);width:min(720px,100%);max-height:86vh;display:flex;flex-direction:column}
.modal .card-b{overflow:auto}
.modal pre{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:10px;white-space:pre-wrap;word-break:break-all;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:50;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.mail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:1000px){.mail{grid-template-columns:minmax(0,1fr)}}
.mailbox{font-size:13px;display:flex;flex-direction:column;gap:6px}
.mailbox .body{font-family:Georgia,"Times New Roman",serif;background:var(--surface-2);border-radius:4px;padding:10px 12px;border:1px solid var(--line)}
.parse li{display:flex;gap:8px;align-items:center;padding:4px 0;color:var(--muted)}
.parse li.done{color:var(--fg)}
.parse li.cur{color:var(--accent);font-weight:500}
.parse ul{list-style:none;margin:0;padding:0}
</style>

<div class="shell">
  <header class="top">
    <div class="top-row">
      <div class="brand"><b>RFQ 智能报价平台</b><span class="tag">原型 · 示例数据</span></div>
      <span class="notice">AI 结果都是预设的示例，不调用真实模型；今天按 2026-10-27 算。</span>
      <span class="spacer"></span>
      <button class="btn sm" data-a="reset">重新开始</button>
    </div>
  </header>
  <section class="tour" id="tour"></section>
  <div class="app">
    <nav class="nav" id="nav" aria-label="主导航"></nav>
    <main class="main" id="main"></main>
  </div>
</div>
<div id="modal"></div>
<div id="toast" hidden></div>

<script>
(function(){
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fx2 = n => (Math.round(n * 100) / 100).toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2});
const STATES = ['待确认登记','待分级','解析中','待确认要求','技术评审','核算中','待审批','已提交','谈判中','结束'];

/* ---------- 示例数据 ---------- */
const QUOTES0 = [

function remChip(q){
  if(q.rem == null) return '<span class="muted">—</span>';
  const lim = q.type === '工程变更' ? [1,3] : [2,5];
  const cls = q.rem <= lim[0] ? 'red' : (q.rem <= lim[1] ? 'amber' : '');
  return '<span class="chip ' + cls + ' mono">剩 ' + q.rem + ' 天</span>';
}
function stChip(q){
  if(q.st === 9) return '<span class="chip green">结束 · ' + esc(q.result || '') + '</span>';
  const stuck = q.stay > 3 && q.st < 7;
  return '<span class="chip ' + (q.st === 3 || q.st === 0 || q.st === 1 ? 'blue' : '') + '">' + STATES[q.st] + '</span>' + (stuck ? ' <span class="chip amber" title="在当前状态超过 3 个工作日">⏸ 停留 ' + q.stay + ' 天</span>' : '');
}

/* ---------- 成本核算（规则引擎，AI 不算价） ---------- */
function opCalc(o, c, ctOverride){
  const ct = ctOverride != null ? ctOverride : o.ct;
  const cct = ct / (o.oee/100);
  const eq = cct/3600*o.rate, lab = cct/3600*o.ppl*c.labor;
  return {cct, eq, lab, sum:eq+lab};
}
function compute(){
  const c = S.cost; const R = {parts:[], flags:[], appr:[], rules:[]};
  let partsSum = 0;
  c.parts.forEach(p => {
    const mat = p.gross*p.price - (p.gross-p.net)*p.rec;
    let proc = 0; const ops = p.ops.map(o => { const r = opCalc(o, c, o.j01 ? c.j01.ct : null); proc += r.sum; return r; });
    const sr = c.scrap + (p.newMat ? 2 : 0);
    const scrap = (mat+proc)*sr/100;
    const tot = (mat+proc+scrap)*p.qty;
    partsSum += tot;
    R.parts.push({mat,proc,ops,sr,scrap,tot,util:p.net/p.gross*100});
    if(p.gross < p.net) R.flags.push({lv:'err',code:'C-01',t:p.name + '：毛重小于净重，不能保存'});
    else if(p.net/p.gross*100 < 50 || p.net/p.gross*100 > 98) R.flags.push({lv:'warn',code:'C-02',t:p.name + '：材料利用率 ' + (p.net/p.gross*100).toFixed(1) + '%，超出常见范围，请核对'});
    p.ops.forEach(o => { if(Math.abs(o.oee - o.def) > 5) R.appr.push({who:'C1',why:p.name + ' · ' + o.n + '：设备综合效率 ' + o.oee + '%，偏离默认值 ' + o.def + '% 超过 5 个百分点'}); });
  });
  const buy = c.buy.map(b => {
    let unit;
    if(b.est) unit = b.arrived ? b.actual : b.last*1.05;
    else unit = b.price*(b.cur === 'EUR' ? c.fx : 1);
    return {unit, tot:unit*b.qty};
  });
  const buySum = buy.reduce((a,b) => a+b.tot, 0);
  const asm = opCalc(c.asm, c);
  if(Math.abs(c.asm.oee - c.asm.def) > 5) R.appr.push({who:'C1',why:'总成装配：设备综合效率 ' + c.asm.oee + '%，偏离默认值 ' + c.asm.def + '% 超过 5 个百分点'});
  const asmScrap = (asm.sum + buySum)*c.scrap/100;
  const toolAlloc = c.tools.filter(t => t.pay === '分摊进单价').reduce((a,t) => a+t.inv, 0) / (c.vol*c.years);
  const matSum = R.parts.reduce((a,p) => a+p.mat*1, 0);
  const procSum = R.parts.reduce((a,p) => a+p.proc, 0) + asm.sum;
  const scrapSum = R.parts.reduce((a,p) => a+p.scrap, 0) + asmScrap;
  const mfg = partsSum + buySum + asm.sum + asmScrap + toolAlloc + c.pack;
  const mgmt = mfg*c.mgmt/100;
  const profit = (mfg+mgmt)*c.profit/100;
  const unit = mfg+mgmt+profit;
  Object.assign(R, {buy,buySum,asm,asmScrap,toolAlloc,matSum,procSum,scrapSum,mfg,mgmt,profit,unit});
  let final = unit;
  if(c.ov.on && c.ov.val !== ''){
    const v = parseFloat(c.ov.val);
    if(!isNaN(v)){ final = v; const pct = Math.abs(v-unit)/unit*100; R.ovPct = pct; if(pct > 5) R.appr.push({who:'C1',why:'人工覆盖单价，幅度 ' + pct.toFixed(1) + '%，超过 5%（J-04）'}); if(!c.ov.reason.trim()) R.flags.push({lv:'err',code:'J-04',t:'人工覆盖必须写理由'}); }
  }
  R.final = final;
  if(c.profit < 5) R.appr.push({who:'工厂领导',why:'利润率 ' + c.profit + '%，低于下限 5%（G-05）'});
  if(c.years < c.life) R.appr.push({who:'商务主管',why:'分摊年数 ' + c.years + ' 年，短于生命周期 ' + c.life + ' 年'});
  const est = c.buy.find(b => b.est && !b.arrived);
  if(est && !c.estReason.trim()) R.flags.push({lv:'err',code:'C-06',t:'轴承还是估价：回价到了再提交，或写明原因'});
  if(!c.j01.reason.trim()) R.flags.push({lv:'err',code:'C-07',t:'人工判断节点 J-01（激光焊接节拍）还没写理由'});
  if(!c.testOk) R.flags.push({lv:'err',code:'G-04',t:'专项测试费要产品工程（E1）确认'});
  R.annual = final*c.vol;
  if(R.annual > 20000000) R.appr.push({who:'工厂领导',why:'年度报价金额超过 2,000 万元'});
  R.rules = [
    ['G-01','新材料加成', c.parts.some(p => p.newMat) ? '触发：管柱支架用 S420MC，成本库里没有使用记录，制造废品率 +2 个百分点' : '未触发', c.parts.some(p => p.newMat)],
    ['G-02','低产量专用分摊', c.vol < 50000 ? '触发：平均年产量低于 5 万套，建议设备按专用分摊' : '未触发：平均年产量 ' + (c.vol/10000) + ' 万套，不低于 5 万套', c.vol < 50000],

    ['G-05','利润率下限', c.profit < 5 ? '触发：转工厂领导审批' : '未触发：利润率 ' + c.profit + '%，不低于 5%', c.profit < 5],
    ['G-06','分摊年数默认','分摊年数默认取生命周期 ' + c.life + ' 年', false],
    ['G-07','汇率变动提示','未触发：用财务公布的 10 月汇率 EUR = ' + c.fx, false]
  ];
  return R;
}

function lineChart(o){
  const W = 520, H = 220, L = 40, Rm = 16, T = 18, B = 30;
  const xs = i => L + i*(W-L-Rm)/(o.vals.length-1);
  const ys = v => T + (o.max - v)/(o.max - o.min)*(H-T-B);
  let s = '<svg class="ch" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.title) + '">';
  o.ticks.forEach(t => { s += '<line class="ax" x1="' + L + '" x2="' + (W-Rm) + '" y1="' + ys(t) + '" y2="' + ys(t) + '"/><text class="lab" x="' + (L-6) + '" y="' + (ys(t)+4) + '" text-anchor="end">' + t + '</text>'; });
  if(o.base != null) s += '<line class="base" x1="' + L + '" x2="' + (W-Rm) + '" y1="' + ys(o.base) + '" y2="' + ys(o.base) + '"/><text class="lab" x="' + (W-Rm) + '" y="' + (ys(o.base)-5) + '" text-anchor="end">基线 ' + o.base + '</text>';
  s += '<line class="tgt" x1="' + L + '" x2="' + (W-Rm) + '" y1="' + ys(o.tgt) + '" y2="' + ys(o.tgt) + '"/><text class="lab" x="' + (L+6) + '" y="' + (ys(o.tgt)+(o.tgtBelow ? 14 : -5)) + '" text-anchor="start" style="fill:var(--green)">目标 ' + o.tgt + '</text>';
  const pts = o.vals.map((v,i) => xs(i) + ',' + ys(v)).join(' ');
  s += '<polygon class="area" points="' + xs(0) + ',' + ys(o.min) + ' ' + pts + ' ' + xs(o.vals.length-1) + ',' + ys(o.min) + '"/><polyline class="line" points="' + pts + '"/>';
  o.vals.forEach((v,i) => { const last = i === o.vals.length-1; s += '<circle class="dot" cx="' + xs(i) + '" cy="' + ys(v) + '" r="' + (last ? 4.5 : 3) + '"/><text class="lab" x="' + xs(i) + '" y="' + (H-10) + '" text-anchor="middle">' + o.labels[i] + '</text>'; if(last) s += '<text class="labt" x="' + (xs(i)-8) + '" y="' + (ys(v)-10) + '" text-anchor="end">' + v + o.unit + '</text>'; });
  return s + '</svg>';
}
function barChart(rows, unit, id){

    s += '<text class="labt" x="' + (L-8) + '" y="' + (y+18) + '" text-anchor="end">' + r[0] + '</text><rect class="bar' + (r[2] ? ' warn' : '') + '" x="' + L + '" y="' + (y+6) + '" width="' + w + '" height="16" rx="2"/><text class="lab" x="' + (L+w+6) + '" y="' + (y+18) + '">' + r[1] + unit + '</text>';
    s += '<rect class="hit" x="0" y="' + y + '" width="' + W + '" height="' + rowH + '" data-a="drill" data-k="' + id + '" data-i="' + i + '"/>';
  });
  return s + '</svg>';
}

  gradeMode(d){ S.grade.mode = d.m; render(); },
  gradeOk(d){
    const q = q24();
    if(d.m === 'edit'){ q.type = $('#gType').value; q.pri = $('#gPri').value; log('S1','修改分级：' + q.type + ' · 优先级 ' + q.pri + '（' + $('#gWhy').value + '）'); }
    else log('S1','采纳 AI 分级建议：新项目 · 优先级 高');
    mark('grade'); setSt(2); S.parseStep = 0; render(); runParse();
  },
  reqSel(d, el, e){
    if(e.target.closest('button')) return;
    S.act = d.id; const r = S.reqs.find(x => x.id === d.id); render();
    if(r && r.st === 'suspect'){ toast('这条要求的原文在文件里找不到，系统标成了“可疑”'); return; }
    const seg = document.getElementById('seg' + d.id), pane = document.getElementById('specPane');
    if(seg && pane){ pane.scrollTop = seg.closest('.page').offsetTop - 40; }
  },
  reqOk(d){ const r = S.reqs.find(x => x.id === d.id); r.st = 'ok'; log('S2','确认要求 ' + r.id + (r.key ? '（关键）' : '')); checkReqDone(); render(); },
  reqDel(d){ const r = S.reqs.find(x => x.id === d.id); r.prev = r.st; r.st = 'deleted'; log('S2','删除要求 ' + r.id); checkReqDone(); render(); },
  reqUndo(d){ const r = S.reqs.find(x => x.id === d.id); r.st = r.prev === 'suspect' ? 'suspect' : 'pending'; render(); },
  reqFix(d){ const r = S.reqs.find(x => x.id === d.id); r.sum = r.fix; r.st = 'edited'; r.suspect = false; S.act = r.id; log('S2','按原文改正可疑条目 ' + r.id + '：720 h → 480 h'); checkReqDone(); render(); toast('已按第 44 页原文改正'); },
  grpOk(d){ const n = S.reqs.filter(r => r.cat === d.c && r.st === 'pending' && !r.key); n.forEach(r => r.st = 'ok'); log('S2','整组确认 ' + d.c + ' 的非关键要求 ' + n.length + ' 条'); checkReqDone(); render(); },
  trans(d, el){ S.trans = el.checked; render(); },
  tab(d){ S.tab = d.t; render(); },
  ckAct(d){
    const c = S.checks.find(x => x.id === d.id);
    if(d.v === 'file'){
      const opts = ['物流说明.pdf 第 3 页','物流说明.pdf 第 4 页','RFQ letter.pdf 第 2 页'];
      S.modal = {title:'补上原文位置 · ' + c.name, body:'<p class="small muted">在哪个文件、哪一页找到的？</p><select class="in" id="ckFile">' + opts.map(o => '<option>' + o + '</option>').join('') + '</select>', foot:'<button class="btn primary" data-a="ckFileOk" data-id="' + c.id + '">保存</button>'};
    } else if(d.v === 'na'){
      S.modal = {title:'标为不适用 · ' + c.name, body:'<p class="small muted">选一个原因：</p><select class="in" id="ckNa"><option>这份询价是机械转向管柱，不含电控单元</option><option>询价范围不含这类零件</option><option>其他（在备注里说明）</option></select>', foot:'<button class="btn primary" data-a="ckNaOk" data-id="' + c.id + '">保存</button>'};
    } else {
      c.act = 'none';
      S.clars.push({id:'C' + (S.clars.length+1), kind:'需澄清', reqs:'关键要求检查', q:'规范没有写“' + c.name + '”的要求' + (c.name === '湿热试验' ? '（第 43 页只写“见项目专用附件（待发布）”）' : '') + '，请客户确认。', ask: c.name === '湿热试验' ? 'The humidity requirements refer to a project-specific annex that was not included. Please provide the annex or confirm the applicable damp-heat test.' : 'Please confirm the requirement for: ' + c.name + '.', owner:'商务', st:'pending', edit:false, from:true});
      log('S2','关键要求“' + c.name + '”确实没有，加入澄清清单'); checkCheckDone(); toast('已加入澄清清单');
    }
    render();
  },
  ckFileOk(d){ const c = S.checks.find(x => x.id === d.id); c.act = 'file'; c.why = $('#ckFile').value; log('S2','关键要求“' + c.name + '”在 ' + c.why + ' 找到，补上位置'); S.modal = null; checkCheckDone(); render(); },
  ckNaOk(d){ const c = S.checks.find(x => x.id === d.id); c.act = 'na'; c.why = $('#ckNa').value; log('S2','关键要求“' + c.name + '”标为不适用：' + c.why); S.modal = null; checkCheckDone(); render(); },
  clOk(d){ const c = S.clars.find(x => x.id === d.id); c.st = 'ok'; log(c.owner === '产品工程' ? 'E1' : 'S2','采纳 ' + c.id); checkClarDone(); render(); },
  clDel(d){ const c = S.clars.find(x => x.id === d.id); c.st = 'deleted'; log(c.owner === '产品工程' ? 'E1' : 'S2','删除 ' + c.id); checkClarDone(); render(); },
  clUndo(d){ const c = S.clars.find(x => x.id === d.id); c.st = 'pending'; render(); },
  clEdit(d){ const c = S.clars.find(x => x.id === d.id); c.edit = true; render(); const t = document.getElementById('clTxt' + c.id); if(t) t.focus(); },
  clSave(d){ const c = S.clars.find(x => x.id === d.id); const t = document.getElementById('clTxt' + c.id); if(t) c.q = t.value; c.edit = false; c.st = 'edited'; log(c.owner === '产品工程' ? 'E1' : 'S2','修改后采纳 ' + c.id); checkClarDone(); render(); },
  exportClar(){ S.modal = {title:'澄清清单（预览）', body:'<p class="small muted">系统不直接发给客户。复制后由商务专员自己发。</p><pre id="modalPre">' + esc(clarText()) + '</pre>', foot:'<button class="btn primary" data-a="copy">复制</button>'}; mark('clar'); render(); },
  copy(){ copyPre(); },
  dSel(d, el, e){ if(e.target.closest('button,input')) return; S.dsel = d.id; mark('draw'); render(); },
  dEdit(d){ const x = S.draw.find(v => v.id === d.id); x.edit = true; S.dsel = d.id; render(); const i = document.getElementById('dv' + d.id); if(i){ i.value = x.right; i.focus(); i.select(); } },
  dSave(d){ const x = S.draw.find(v => v.id === d.id); const i = document.getElementById('dv' + d.id); x.val = i ? i.value : x.val; x.edit = false; x.st = 'fixed'; log('S2','改正图纸字段“' + x.name + '”：' + x.ai + ' → ' + x.val); mark('draw'); render(); },
  toReview(){ setSt(4); S.tab = 'review'; mark('req'); mark('check'); log('S2','要求清单和关键要求检查全部确认，提交技术评审'); render(); },
  concl(d, el){ S.review.concl = el.value; render(); },
  dev(d, el){ S.review.devs[d.id] = el.checked; },
  reviewOk(){ const t = $('#revTxt'); S.review.text = t ? t.value : ''; setSt(5); S.tab = 'cost'; mark('review'); log('E1','提交评审意见：' + S.review.concl); render(); window.scrollTo({top:0}); },
  simPick(d){ S.cost.sim = d.id; const s = SIMS.find(x => x.id === d.id); log('C3','参考相似项目：' + s.y + ' ' + s.cust + ' ' + s.name); render(); },
  quoteArrive(){ const b = S.cost.buy[0]; b.arrived = true; S.cost.changed = ['B1']; log('P1','轴承供应商回价 7.60 元，替换估价 7.14 元'); render(); toast('回价已更新，变化的行已高亮'); setTimeout(() => { S.cost.changed = []; }, 3500); },
  testOk(){ S.cost.testOk = true; log('E1','确认专项测试费 35,000 元（G-04）'); render(); },
  ovToggle(d, el){ S.cost.ov.on = el.checked; render(); },
  submitAppr(){ const R = compute(); if(R.flags.some(f => f.lv === 'err')) return; setSt(6); S.tab = 'appr'; mark('cost'); log('C3','提交审批：单价 ¥' + fx2(R.final) + '，按本体 v1.1 锁定'); render(); window.scrollTo({top:0}); },
  approve(){ const R = compute(); approvalRoute(R).forEach(a => log(a.who,'审批通过')); setSt(7); log('系统','按客户D 模板生成报价单和成本分解表'); render(); },
  resultOpen(){ S.modal = {title:'登记定点结果', body:'<label class="stack small"><span class="muted">结果</span><select class="in" id="resR"><option>已定点</option><option>丢标</option><option>客户取消</option><option>我方放弃</option></select></label><div class="stack small"><span class="muted">丢标原因（结果为“丢标”时必选，可多选）</span>' + ['价格偏高','技术方案','交期','客户关系','其他'].map(r => '<label class="row" style="gap:6px"><input type="checkbox" class="lostWhy" value="' + r + '">' + r + '</label>').join('') + '</div>', foot:'<button class="btn primary" data-a="resultOk">保存</button><span class="small muted" id="resErr"></span>'}; render(); },
  resultOk(){
    const r = $('#resR').value; const why = Array.prototype.slice.call(document.querySelectorAll('.lostWhy:checked')).map(x => x.value);
    if(r === '丢标' && !why.length){ $('#resErr').textContent = '丢标时必须选原因'; return; }
    S.result = {r, why: why.join('、')}; const q = q24(); q.st = 9; q.result = r; q.rem = null; q.due = '—';
    log('S2','登记定点结果：' + r + (why.length ? '（' + why.join('、') + '）' : '')); mark('appr'); S.modal = null; render();
    toast(r === '已定点' ? '已定点，可以查看 ERP 导入文件' : '已登记，丢标原因会进统计看板');
  },
  erp(){
    const R = compute();
    const txt = 'project_no,customer,program,part_no,description,unit_price_cny,annual_volume,sop,lifetime_years\nQ2610-024,客户D,X1,D-SC-ASSY-01,转向管柱总成,' + R.final.toFixed(2) + ',' + S.cost.vol + ',2028-03,' + S.cost.life;
    S.modal = {title:'ERP 导入文件（预览）', body:'<p class="small muted">按 ERP 现有的导入格式生成，放到约定目录，由 ERP 每天定时导入；正式接口等 IT 排期。</p><pre id="modalPre">' + esc(txt) + '</pre>', foot:'<button class="btn primary" data-a="copy">复制</button>'}; render();
  },
  monthly(){
    const txt = 'RFQ 智能报价平台 · 2026 年 10 月月报（示例）\n\n本月进展：系统交接 IT 后运行稳定；第二次季度模型复评进行中。\n关键指标（和基线比）：要求梳理 3 → 1.1 人天；漏项 6 → 1.4 条，关键要求不漏；报价周期 18 → 13.5 个工作日；按时提交率 70% → 88%。\n一个例子：某份 RFQ，系统在附件里找出了可回收料箱的要求，避免了一次补报。\n需要支持：下一期做供应商报价解析，需要采购 P1 配合调研。\n下月计划：完成季度复评；补齐 2 家客户模板。\n致谢：S1、C1 和 IT 的 T1。';
    S.modal = {title:'月报一页纸（预览）', body:'<pre id="modalPre">' + esc(txt) + '</pre>', foot:'<button class="btn primary" data-a="copy">复制</button>'}; render();
  },
  drill(d){
    const map = {stage:['Q2609-031','Q2609-027','Q2610-006','Q2610-012','Q2610-015','Q2610-021'], lost:['Q2605-014','Q2606-022','Q2607-009','Q2608-017']};
    const label = d.k === 'stage' ? ['读规范和澄清','评审和工艺','核算','等供应商回价','汇总和模板','审批','其他'][+d.i] : ['价格偏高','技术方案','交期','其他'][+d.i];
    S.modal = {title:'下钻：' + label, body:'<p class="small muted">这个数字由下面这些报价单算出来（原型示例）：</p><div class="row">' + map[d.k].map(x => '<span class="chip mono">' + x + '</span>').join('') + '</div>'}; render();
  },
  mailFix(){ S.mailDone = true; log('S2','把未识别邮件“Fw: 新项目报价邀请”转成新询价'); render(); toast('已转成新询价。原型里只演示到这一步'); },
  mailIgnore(){ S.mailDone = true; render(); },
  modalClose(){ S.modal = null; render(); },
  modalBg(d, el, e){ if(e.target === el){ S.modal = null; render(); } }
};
function checkReqDone(){ if(!pendingReqs()) toast('要求清单都确认完了'); }
function checkCheckDone(){ if(!pendingChecks()){ mark('check'); toast('6 个“没找到”都处理完了'); } }
function checkClarDone(){ if(!pendingClars()) mark('clar'); }
function runParse(){
  const t = setInterval(() => {
    const q = q24();
    if(!q || q.st !== 2){ clearInterval(t); return; }
    S.parseStep++;
    if(S.parseStep >= PARSE.length){
      clearInterval(t); setSt(3); log('系统 · AI','解析完成：要求 16 条（原型节选），关键要求找到 34 项、没找到 6 项，起草澄清 7 条，图纸字段 8 个');
      S.view = 'detail'; S.sel = 'Q2610-024'; S.tab = 'req'; render(); window.scrollTo({top:0}); toast('解析完成，请确认要求清单');
      return;
    }
    if(S.view === 'draft') render();
  }, 380);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if(!el) return;
  const fn = A[el.dataset.a];
  if(!fn) return;
  if(el.tagName === 'INPUT' && (el.type === 'checkbox' || el.type === 'radio')) return;
  fn(el.dataset, el, e);
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset && el.dataset.a && (el.type === 'checkbox' || el.type === 'radio')){ const fn = A[el.dataset.a]; if(fn) fn(el.dataset, el, e); return; }
  if(el.dataset && el.dataset.c){
    const path = el.dataset.c.split('.'); let o = S.cost;
    for(let i = 0; i < path.length-1; i++) o = o[path[i]];
    const k = path[path.length-1];
    o[k] = k === 'val' ? el.value : (parseFloat(el.value) || 0);
    render();
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if(el.dataset && el.dataset.c2){
    const path = el.dataset.c2.split('.'); let o = S.cost;
    for(let i = 0; i < path.length-1; i++) o = o[path[i]];
    o[path[path.length-1]] = el.value;
  }
});
document.addEventListener('focusout', e => {
  const el = e.target;
  if(el.dataset && el.dataset.c2) render();
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && S.modal){ S.modal = null; render(); } });

render();
})();
</script>
